name: codecov

on:
  push:
    paths-ignore:
      - "*.md"
      - "LICENSE"
      - "docs/**"
      - "images/**"
      - ".github/ISSUE_TEMPLATE/**"

  pull_request:
    branches: [main]
    paths-ignore:
      - "*.md"
      - "LICENSE"
      - "docs/**"
      - "images/**"
      - ".github/ISSUE_TEMPLATE/**"

jobs:
  tests:
    name: Collect and upload coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.15"

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Install ampworks
        run: uv pip install --system nox .[gui,tests]

      - name: Collect coverage
        run: nox -s tests -- codecov

      - name: Upload to codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          verbose: true
          flags: unittests
          env_vars: OS,PYTHON
          files: ./coverage.xml
          name: codecov-umbrella
          fail_ci_if_error: false
